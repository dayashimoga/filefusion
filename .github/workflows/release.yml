name: Release FileFusion

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-baseline:
    name: Verify Release Workspace & License Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run format, clippy, and workspace tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked

      - name: Verify advisories, licenses, and bans
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories licenses bans sources

  publish-release:
    name: Draft Tagged GitHub Release
    needs: verify-release-baseline
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate baseline source checksum manifest
        shell: bash
        run: |
          mkdir -p release-meta
          sha256sum Cargo.toml Cargo.lock LICENSE LICENSES.md SECURITY.md > release-meta/SHA256SUMS-governance.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-meta/SHA256SUMS-governance.txt
            LICENSE
            LICENSES.md
