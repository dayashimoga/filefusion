[workspace]
resolver = "2"
members = [
    "crates/file-core",
    "crates/codec-registry",
    "crates/validation-engine",
    "crates/job-manager",
    "apps/cli",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/dayashimoga/filefusion"
authors = ["FileFusion Contributors"]

[workspace.dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }

file-core = { path = "crates/file-core" }
codec-registry = { path = "crates/codec-registry" }
validation-engine = { path = "crates/validation-engine" }
job-manager = { path = "crates/job-manager" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
