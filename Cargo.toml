[workspace]
resolver = "2"
members = [
    "crates/file-core",
    "crates/codec-registry",
    "crates/hardware-acceleration",
    "crates/quality-engine",
    "crates/validation-engine",
    "crates/compression-core",
    "crates/compression-image",
    "crates/compression-archive",
    "crates/compression-audio",
    "crates/compression-video",
    "crates/compression-pdf",
    "crates/compression-office",
    "crates/optimization-engine",
    "crates/job-manager",
    "apps/cli",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/dayashimoga/filefusion"
authors = ["FileFusion Contributors"]

[workspace.dependencies]
aes-gcm = "0.11"
argon2 = "0.6"
blake3 = "1.5"
brotli = "9.1"
chacha20poly1305 = "0.11"
clap = { version = "4.5", features = ["derive"] }
claxon = "0.4"
crc32fast = "1.4"
criterion = { version = "0.6", default-features = false, features = ["cargo_bench_support"] }
fast_image_resize = "5.1"
flacenc = { version = "0.5", default-features = false, features = ["serde"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
getrandom = "0.4"
hound = "3.5"
id3 = "1.17"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
lopdf = { version = "0.42", default-features = false }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "frame", "checked-decode"] }
lzma-rust2 = "0.26"
oxipng = { version = "9.1", default-features = false }
oxiarc-bzip2 = "0.4"
ravif = { version = "0.11", default-features = false }
rayon = "1.10"
rgb = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sevenz-rust = { version = "0.6", default-features = false, features = ["compress"] }
sha2 = "0.10"
symphonia = { version = "0.6", default-features = false, features = ["opt-simd", "all-meta", "all-codecs", "all-formats"] }
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
zip = { version = "7.3", default-features = false, features = ["deflate-flate2", "aes-crypto", "time"] }
zstd = "0.14"

file-core = { path = "crates/file-core" }
codec-registry = { path = "crates/codec-registry" }
hardware-acceleration = { path = "crates/hardware-acceleration" }
quality-engine = { path = "crates/quality-engine" }
validation-engine = { path = "crates/validation-engine" }
compression-core = { path = "crates/compression-core" }
compression-image = { path = "crates/compression-image" }
compression-archive = { path = "crates/compression-archive" }
compression-audio = { path = "crates/compression-audio" }
compression-video = { path = "crates/compression-video" }
compression-pdf = { path = "crates/compression-pdf" }
compression-office = { path = "crates/compression-office" }
optimization-engine = { path = "crates/optimization-engine" }
job-manager = { path = "crates/job-manager" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
