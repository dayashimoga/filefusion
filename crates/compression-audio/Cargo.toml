[package]
name = "compression-audio"
description = "FileFusion L3 pure-Rust audio compression, DSP normalization (EBU R128 LUFS), tag scrubbing, and Tier 2 FFmpeg audio engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["native-logging", "native-process"]
native-logging = ["compression-core/native-logging", "file-core/native-logging", "quality-engine/native-logging"]
native-process = []
wasm = ["compression-core/wasm", "file-core/wasm", "quality-engine/wasm", "validation-engine/wasm"]

[dependencies]
claxon.workspace = true
codec-registry = { workspace = true, default-features = false }
compression-core = { workspace = true, default-features = false }
file-core = { workspace = true, default-features = false }
flacenc.workspace = true
hound.workspace = true
id3.workspace = true
quality-engine = { workspace = true, default-features = false }
serde.workspace = true
symphonia.workspace = true
validation-engine = { workspace = true, default-features = false }

[lints]
workspace = true
