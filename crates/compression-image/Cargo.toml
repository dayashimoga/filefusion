[package]
name = "compression-image"
description = "FileFusion L3 raster image compression & SIMD resizing engine (JPEG, PNG/oxipng, WebP, AVIF/ravif, GIF, BMP, TIFF, ICO)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["native-logging"]
native-logging = ["compression-core/native-logging", "file-core/native-logging", "quality-engine/native-logging"]
wasm = ["compression-core/wasm", "file-core/wasm", "quality-engine/wasm", "validation-engine/wasm"]

[dependencies]
codec-registry = { workspace = true, default-features = false }
compression-core = { workspace = true, default-features = false }
fast_image_resize.workspace = true
file-core = { workspace = true, default-features = false }
image.workspace = true
oxipng.workspace = true
quality-engine = { workspace = true, default-features = false }
ravif.workspace = true
rgb.workspace = true
serde.workspace = true
validation-engine = { workspace = true, default-features = false }

[lints]
workspace = true
