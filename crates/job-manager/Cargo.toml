[package]
name = "job-manager"
description = "FileFusion L5 control plane: cooperative cancellation, structured tracing spans, capability orchestration, and job scheduling foundation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["native-logging"]
