[package]
name = "job-manager"
description = "FileFusion L5 control plane: cooperative cancellation, structured tracing spans, capability orchestration, and job scheduling foundation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["native-logging", "native-scheduler", "rayon-parallel"]
native-logging = ["file-core/native-logging", "codec-registry/native-probe"]
native-scheduler = ["dep:tokio"]
rayon-parallel = ["dep:rayon"]
wasm = ["file-core/wasm", "codec-registry/wasm"]

[dependencies]
codec-registry = { workspace = true, default-features = false }
file-core = { workspace = true, default-features = false }
rayon = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
tracing.workspace = true
validation-engine.workspace = true

[lints]
workspace = true
