[package]
name = "job-manager"
description = "FileFusion L5 control plane: cooperative cancellation, structured tracing spans, capability orchestration, and job scheduling foundation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["native-logging", "native-process", "native-scheduler", "rayon-parallel"]
native-logging = [
    "file-core/native-logging",
    "codec-registry/native-probe",
    "hardware-acceleration/hw-accel",
    "hardware-acceleration/native-logging",
    "optimization-engine/native-logging",
    "quality-engine/native-logging",
]
native-process = ["codec-registry/native-probe", "optimization-engine/native-process"]
native-scheduler = ["dep:tokio"]
rayon-parallel = ["dep:rayon"]
wasm = [
    "file-core/wasm",
    "codec-registry/wasm",
    "hardware-acceleration/wasm",
    "optimization-engine/wasm",
    "quality-engine/wasm",
    "validation-engine/wasm",
]

[dependencies]
codec-registry = { workspace = true, default-features = false }
file-core = { workspace = true, default-features = false }
hardware-acceleration = { workspace = true, default-features = false }
optimization-engine = { workspace = true, default-features = false }
quality-engine = { workspace = true, default-features = false }
rayon = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
tracing.workspace = true
validation-engine.workspace = true

[lints]
workspace = true
